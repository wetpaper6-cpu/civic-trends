name: 시민사회 동향

on:
  schedule:
    # 일~목 오후 5시 17분(KST) 시작. GitHub 예약 실행은 늦어지거나 빠지는 일이 있어
    # 5시 47분, 6시 17분에도 예비로 시작하고, 이미 게재됐으면 건너뜀
    - cron: "17 8 * * 0-4"
    - cron: "47 8 * * 0-4"
    - cron: "17 9 * * 0-4"
  workflow_dispatch:          # Actions 탭에서 수동 실행
    inputs:
      weekly:
        description: "주간 동향도 만들기 (목요일이 아니어도 시험용으로)"
        type: boolean
        default: false
      report_date:
        description: "다시 만들 날짜 (예: 2026-11-25). 비우면 오늘"
        type: string
        default: ""

permissions:
  contents: write

concurrency: civic-trends

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 날짜 정하기
        run: |
          D="${{ inputs.report_date }}"
          if [ -z "$D" ]; then
            D=$(date +%F)
            # 예약 실행이 크게 늦어져 다음 날 새벽·오전에 시작된 경우: 원래 날짜로 처리
            if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date +%-H)" -lt 12 ]; then
              D=$(date -d yesterday +%F)
            fi
          fi
          echo "REPORT_DATE=$D" >> "$GITHUB_ENV"
          SKIP=false
          # 예비 예약 실행: 그날 저녁 동향이 이미 게재됐으면 건너뜀
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "docs/data/$D.json" ]; then
            G=$(python3 -c "import json;print(json.load(open('docs/data/$D.json'))['generated_at'])")
            case "$G" in "$D"T1[7-9]*|"$D"T2*) SKIP=true ;; esac
          fi
          echo "SKIP=$SKIP" >> "$GITHUB_ENV"
          echo "대상 날짜: $D / 건너뛰기: $SKIP"

      - name: 준비 (Word 라이브러리, 한글 글꼴)
        if: env.SKIP != 'true'
        run: |
          pip install python-docx
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 일일 동향 수집·정리
        if: env.SKIP != 'true'
        run: python scripts/collect.py

      - name: 주간 동향 (목요일)
        if: env.SKIP != 'true'
        run: |
          D=$REPORT_DATE
          if [ "$(date -d "$D" +%u)" = "4" ] || [ "${{ inputs.weekly }}" = "true" ]; then
            python scripts/weekly.py
          else
            echo "목요일이 아니라 주간 동향은 건너뜁니다."
          fi

      - name: Word·PDF 만들기
        if: env.SKIP != 'true'
        run: python scripts/render.py

      - name: 사이트에 반영
        if: env.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "동향: $REPORT_DATE"
          git pull --rebase -X theirs origin main || git pull --rebase origin main  # 실행 중 저장소가 바뀐 경우
          git push

      - name: 릴리즈 게시
        if: env.SKIP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D=$REPORT_DATE
          publish() {  # 태그, 제목파일, 노트파일, 첨부파일...
            tag=$1; title=$(cat "$2"); notes=$3; shift 3
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$@" --clobber
              gh release edit "$tag" --title "$title" --notes-file "$notes"
            else
              gh release create "$tag" "$@" --title "$title" --notes-file "$notes"
            fi
          }
          publish "daily-$D" build/daily-title.txt build/daily-notes.md \
            "docs/files/daily-$D.docx" "docs/files/daily-$D.pdf"
          if [ -f build/weekly-notes.md ]; then  # 이번 실행에서 주간 동향을 만든 경우에만
            publish "weekly-$D" build/weekly-title.txt build/weekly-notes.md \
              "docs/files/weekly-$D.docx" "docs/files/weekly-$D.pdf"
          fi
